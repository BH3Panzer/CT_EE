[package]
name = "CT_EE"
version = "0.0.1"
edition = "2024"


[dependencies]
bevy = { version = "0.16.0", features = ["bevy_dev_tools"] }
rand = "0.9.1"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3
